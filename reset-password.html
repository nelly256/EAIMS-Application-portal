<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create a new EAIMS application portal password" />
  <title>Reset Password | EAIMS Online Application Portal</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body class="auth-page-body">
  <main class="auth-page">
    <div class="auth-page-inner">
      <section class="auth-brand" aria-label="EAIMS Online Application Portal">
        <img class="brand-logo" src="/eaims-logo.jpeg" alt="EAIMS logo" />
        <h1 class="institution-name">EAST AFRICAN INSTITUTE FOR MANAGEMENT SCIENCE</h1>
        <p class="portal-subtitle">ONLINE APPLICATION PORTAL</p>
      </section>
      <section class="auth-card" aria-labelledby="reset-title">
        <div class="auth-header">
          <h2 class="auth-title" id="reset-title">CREATE A NEW PASSWORD</h2>
          <p class="auth-subtitle">Choose a strong password for your applicant account.</p>
        </div>
        <form id="resetForm" novalidate>
          <div class="field">
            <label class="visually-hidden" for="password">New Password</label>
            <div class="input-shell password-shell">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input id="password" name="password" type="password" placeholder="New Password" autocomplete="new-password" minlength="8" required />
              <button class="password-toggle" type="button" aria-controls="password" aria-label="Show password" aria-pressed="false">
                <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m3 3 18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.4 17.4 0 0 1-2.2 2.9M6.6 6.6C3.7 8.3 2 12 2 12s3.5 7 10 7c1.5 0 2.8-.3 4-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
            <p class="field-error" data-field-error="password" hidden></p>
          </div>
          <div class="field">
            <label class="visually-hidden" for="confirmPassword">Confirm New Password</label>
            <div class="input-shell password-shell">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm New Password" autocomplete="new-password" minlength="8" required />
              <button class="password-toggle" type="button" aria-controls="confirmPassword" aria-label="Show password" aria-pressed="false">
                <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m3 3 18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.4 17.4 0 0 1-2.2 2.9M6.6 6.6C3.7 8.3 2 12 2 12s3.5 7 10 7c1.5 0 2.8-.3 4-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
            <p class="field-error" data-field-error="confirmPassword" hidden></p>
          </div>
          <div id="formError" class="form-message form-message-error" role="alert" hidden></div>
          <div id="formSuccess" class="form-message form-message-success" role="status" hidden></div>
          <button class="btn btn-primary btn-lg btn-block auth-submit" type="submit">RESET PASSWORD</button>
        </form>
        <p class="auth-footer-text"><a class="auth-link" href="/login.html">Back to login</a></p>
      </section>
    </div>
  </main>
  <footer class="auth-footer"><p>&copy; 2026 EAIMS. All Rights Reserved.</p></footer>
  <script src="/js/auth-client.js"></script>
  <script src="/js/reset.js"></script>
</body>
</html>
