<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Recover your EAIMS application portal password" />
  <title>Forgot Password | EAIMS Online Application Portal</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body class="auth-page-body">
  <main class="auth-page">
    <div class="auth-page-inner">
      <section class="auth-brand" aria-label="EAIMS Online Application Portal">
        <img class="brand-logo" src="/eaims-logo.jpeg" alt="EAIMS logo" />
        <h1 class="institution-name">EAST AFRICAN INSTITUTE FOR MANAGEMENT SCIENCE</h1>
        <p class="portal-subtitle">ONLINE APPLICATION PORTAL</p>
      </section>
      <section class="auth-card" aria-labelledby="recovery-title">
        <div class="auth-header">
          <h2 class="auth-title" id="recovery-title">RESET YOUR PASSWORD</h2>
          <p class="auth-subtitle">Enter your registered email address or phone number.</p>
        </div>
        <form id="recoveryForm" novalidate>
          <div class="field">
            <label class="visually-hidden" for="identifier">Email or Phone Number</label>
            <div class="input-shell">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
              <input id="identifier" name="identifier" type="text" placeholder="Email or Phone Number" autocomplete="username" required />
            </div>
            <p class="field-error" data-field-error="identifier" hidden></p>
          </div>
          <div id="formError" class="form-message form-message-error" role="alert" hidden></div>
          <div id="formSuccess" class="form-message form-message-success" role="status" hidden></div>
          <button class="btn btn-primary btn-lg btn-block auth-submit" type="submit">SEND RESET INSTRUCTIONS</button>
        </form>
        <p class="auth-footer-text"><a class="auth-link" href="/login.html">Back to login</a></p>
      </section>
    </div>
  </main>
  <footer class="auth-footer"><p>&copy; 2026 EAIMS. All Rights Reserved.</p></footer>
  <script src="/js/auth-client.js"></script>
  <script src="/js/recovery.js"></script>
</body>
</html>
