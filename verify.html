<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Verify your EAIMS application account" />
  <title>Verify Account | EAIMS Online Application Portal</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body class="auth-page-body">
  <main class="auth-page">
    <div class="auth-page-inner">
      <section class="auth-brand" aria-label="EAIMS Online Application Portal">
        <img class="brand-logo" src="/eaims-logo.jpeg" alt="EAIMS logo" />
        <h1 class="institution-name">EAST AFRICAN INSTITUTE FOR MANAGEMENT SCIENCE</h1>
        <p class="portal-subtitle">ONLINE APPLICATION PORTAL</p>
      </section>

      <section class="auth-card" aria-labelledby="verify-title">
        <div class="auth-header">
          <h2 class="auth-title" id="verify-title">VERIFY YOUR ACCOUNT</h2>
          <p class="auth-subtitle">Enter the one time code sent to your email address or phone number.</p>
        </div>
        <form id="verifyForm" novalidate>
          <div class="field">
            <label class="visually-hidden" for="code">Verification code</label>
            <div class="input-shell verification-shell">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter 6-digit code" required />
            </div>
            <p class="field-error" data-field-error="code" hidden></p>
          </div>
          <div id="formError" class="form-message form-message-error" role="alert" hidden></div>
          <div id="formSuccess" class="form-message form-message-success" role="status" hidden></div>
          <p id="deliveryInfo" class="form-message form-message-info" role="status" hidden></p>
          <button class="btn btn-primary btn-lg btn-block auth-submit" type="submit">VERIFY ACCOUNT</button>
          <button id="resendVerification" class="btn btn-outline btn-block auth-secondary" type="button">RESEND CODE</button>
        </form>
        <p class="auth-footer-text">Already verified? <a class="auth-link" href="/login.html">Log in</a></p>
      </section>
    </div>
  </main>
  <footer class="auth-footer"><p>&copy; 2026 EAIMS. All Rights Reserved.</p></footer>
  <script src="/js/auth-client.js"></script>
  <script src="/js/verify.js"></script>
</body>
</html>
